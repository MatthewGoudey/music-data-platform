name: reconcile

# Sundays 09:47 UTC (04:47 Chicago CDT), after daily-sync. Pages the whole ListenBrainz
# history and records the stored listens it no longer has; dq's listens_beyond_listenbrainz
# reads the latest run, so a deletion upstream turns the next daily dq red. Delete the
# reported listens with `-f args=--delete` once Matt confirms them.
on:
  schedule:
    - cron: "47 9 * * 0"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to run (dev or prod); blank runs both"
        required: false
        default: ""
      args:
        description: "Extra arguments (--delete removes the listens ListenBrainz lacks)"
        required: false
        default: ""

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(github.event.inputs.env != '' && format('["{0}"]', github.event.inputs.env) || '["dev","prod"]') }}
    environment: ${{ matrix.env }}
    env:
      MUSICDATA_ENV: ${{ matrix.env }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LISTENBRAINZ_USER: ${{ vars.LISTENBRAINZ_USER }}
      MUSICBRAINZ_USER_AGENT: ${{ vars.MUSICBRAINZ_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: prod runs the latest v* tag; dev runs main
        if: matrix.env == 'prod'
        run: |
          tag="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then echo "no v* tag yet: prod has nothing to run"; exit 1; fi
          echo "checking out $tag"
          git checkout --quiet "$tag"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: reconcile
        run: uv run musicdata reconcile ${{ github.event.inputs.args }}
      - name: derive (after a delete)
        if: contains(github.event.inputs.args, '--delete')
        run: uv run musicdata derive

      - name: notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -H "Title: musicdata ${{ matrix.env }} reconcile failed" \
                 -H "Priority: high" \
                 -d "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 "https://ntfy.sh/$NTFY_TOPIC" || true
          fi
