name: deploy-api

# main → dev. A tag v* → prod. A tag is the only road to prod.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      env:
        description: "dev or prod"
        required: true
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (github.event.inputs.env || 'dev') }}
    env:
      TARGET: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (github.event.inputs.env || 'dev') }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: migrate ${{ env.TARGET }}
        run: uv run alembic upgrade head
        env:
          MUSICDATA_ENV: ${{ env.TARGET }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy ${{ env.TARGET }}
        run: flyctl deploy --remote-only --config "fly.${TARGET}.toml"
      # The shows job runs on Fly, not here: Oh My Rockness refuses GitHub's datacenter
      # addresses (ADR 0006). A scheduled machine on the image just deployed replaces the
      # previous one. `fly machine run` skips fly.toml [env], so the env is passed here.
      - name: schedule the nightly shows job on ${{ env.TARGET }}
        run: |
          cfg="fly.${TARGET}.toml"
          image="$(flyctl machine list --config "$cfg" --json \
            | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")][0].config.image')"
          for id in $(flyctl machine list --config "$cfg" --json \
                      | jq -r '.[] | select(.name == "shows-nightly") | .id'); do
            flyctl machine destroy "$id" --force --config "$cfg"
          done
          flyctl machine run "$image" musicdata shows \
            --config "$cfg" --name shows-nightly --schedule daily --region ord \
            --vm-size shared-cpu-1x --vm-memory 256 --restart no \
            --env MUSICDATA_ENV="$TARGET" \
            --env LISTENBRAINZ_USER=MatthewG606 \
            --env "MUSICBRAINZ_USER_AGENT=musicdata/0.1 (https://github.com/MatthewGoudey/music-data-platform)"
