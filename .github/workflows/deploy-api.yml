name: deploy-api

# main → dev. A tag v* → prod. A tag is the only road to prod.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      env:
        description: "dev or prod"
        required: true
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (github.event.inputs.env || 'dev') }}
    env:
      TARGET: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (github.event.inputs.env || 'dev') }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: migrate ${{ env.TARGET }}
        run: uv run alembic upgrade head
        env:
          MUSICDATA_ENV: ${{ env.TARGET }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy ${{ env.TARGET }}
        run: flyctl deploy --remote-only --config "fly.${TARGET}.toml"
