name: graph-nightly

# Companion spec 3.7. Prod runs after daily-sync completes, on the latest v* tag; dev runs by
# workflow_dispatch only. Phase 6 Block C (Matt's go, 2026-10-10): the near-queue set, then the
# default scope's import (400 albums), fetch (500 credits a night, 15,000 in all) and facts, then
# link, verify --pending, connections (Block D) and dq. The import stops at 650 MB of database (spec section 9).
on:
  workflow_run:
    workflows: ["daily-sync"]
    types: [completed]
  workflow_dispatch:
    inputs:
      env:
        description: "dev or prod"
        required: true
        default: "dev"

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: ${{ github.event_name == 'workflow_run' && 'prod' || github.event.inputs.env }}
    env:
      MUSICDATA_ENV: ${{ github.event_name == 'workflow_run' && 'prod' || github.event.inputs.env }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MUSICBRAINZ_USER_AGENT: ${{ vars.MUSICBRAINZ_USER_AGENT }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: prod runs the latest v* tag; dev runs main
        if: env.MUSICDATA_ENV == 'prod'
        run: |
          tag="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then echo "no v* tag yet: prod has nothing to run"; exit 1; fi
          echo "checking out $tag"
          git checkout --quiet "$tag"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: near-queue
        id: near
        run: uv run musicdata graph near-queue
      - name: import (default scope)
        id: import
        if: always()
        run: uv run musicdata graph import --scope default --limit 400
      - name: fetch (default scope)
        id: fetch
        if: always()
        run: uv run musicdata graph fetch --scope default --max-credits 500
      - name: facts (default scope)
        id: facts
        if: always()
        run: uv run musicdata graph facts --scope default
      - name: link
        id: link
        if: always()
        run: uv run musicdata graph link
      - name: verify pending
        id: verify
        if: always()
        run: uv run musicdata graph verify --pending
      - name: connections
        id: connections
        if: always()
        run: uv run musicdata graph connections
      - name: follow lists
        id: follow
        if: always()
        run: uv run musicdata graph follow-lists
      - name: dq
        id: dq
        if: always()
        run: uv run musicdata dq

      - name: notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -H "Title: musicdata ${{ env.MUSICDATA_ENV }} graph-nightly failed" \
                 -H "Priority: high" \
                 -d "near=${{ steps.near.outcome }} import=${{ steps.import.outcome }} fetch=${{ steps.fetch.outcome }} facts=${{ steps.facts.outcome }} link=${{ steps.link.outcome }} verify=${{ steps.verify.outcome }} connections=${{ steps.connections.outcome }} dq=${{ steps.dq.outcome }}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 "https://ntfy.sh/$NTFY_TOPIC" || true
          fi
