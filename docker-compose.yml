# Local Postgres for tests and for running jobs against a throwaway database.
#   docker compose up -d db
#   DATABASE_URL=postgresql://musicdata:musicdata@localhost:5432/musicdata uv run alembic upgrade head
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: musicdata
      POSTGRES_PASSWORD: musicdata
      POSTGRES_DB: musicdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicdata"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
